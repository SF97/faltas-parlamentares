monorepo_root = true

[monorepo]
config_roots = ["ingest", "site"]

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm", "python"]

[tasks.lint-actions]
description = "Verifica os workflows do GitHub Actions e os scripts shell"
tools = { actionlint = "1.7.12", shellcheck = "0.11.0" }
run = "actionlint"

[tasks.act]
description = "Executa workflows localmente com act"
tools = { act = "0.2.89" }
run = "act"

[tasks.lint]
description = "Executa todos os linters do repositório"
depends = [":install-lint", ":lint-actions"]
run = "pnpm -r run lint"

[tasks.install-lint]
description = "Instala apenas as dependências de desenvolvimento para lint"
run = "pnpm install --dev --frozen-lockfile"

[tasks.install]
description = "Instala as dependências Python e JavaScript do workspace"
run = "pnpm install --frozen-lockfile"
