name: Update data

on:
  schedule:
    - cron: "0 6 * * *"
  # This is needed so I can manually force a run in GitHub for debugging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # mise run also loads the root tools; install them while the token is available.
          install_args: "--monorepo python uv act actionlint shellcheck"

      - name: Run ingest
        run: mise //ingest:refresh

      - name: Commit refreshed data
        # Commit and push only when both conditions hold:
        # - !env.ACT: this is a GitHub run, rather than a local act run.
        # - github.ref is main: manual runs on other branches only generate data.
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' }}
        run: |
          if [[ -z "$(git status --porcelain site/src/data)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data
          if git diff --cached --quiet -G '"updated_at"[[:space:]]*:' -- site/src/data/meta.json; then
            message="chore(data): verify parlamento.pt (no data changes)"
          else
            message="chore(data): refresh from parlamento.pt"
          fi
          git commit -m "$message"
          git push
