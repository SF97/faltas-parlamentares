name: Update data

on:
  schedule:
    - cron: "0 6 * * *"
  # This is needed so I can manually force a run in GitHub for debugging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14
        working-directory: ingest

      - name: Install ingest deps
        run: uv sync
        working-directory: ingest

      - name: Run ingest (no HTTP cache)
        env:
          FALTAS_NO_CACHE: "1"
        run: uv run python -m ingest.main
        working-directory: ingest

      - name: Commit refreshed data
        run: |
          if [[ -z "$(git status --porcelain site/src/data)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data
          git commit -m "chore(data): refresh from parlamento.pt [skip ci]"
          git push
