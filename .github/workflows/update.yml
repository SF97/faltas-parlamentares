name: Update data

on:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        if: github.event_name != 'push'
        with:
          enable-cache: true

      - name: Set up Python
        if: github.event_name != 'push'
        run: uv python install 3.14
        working-directory: ingest

      - name: Install ingest deps
        if: github.event_name != 'push'
        run: uv sync
        working-directory: ingest

      - name: Run ingest (no HTTP cache)
        if: github.event_name != 'push'
        env:
          FALTAS_NO_CACHE: "1"
        run: uv run python -m ingest.main
        working-directory: ingest

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          if [[ -z "$(git status --porcelain site/src/data)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data
          git commit -m "chore(data): refresh from parlamento.pt [skip ci]"
          git push

      - uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: site/package.json
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
