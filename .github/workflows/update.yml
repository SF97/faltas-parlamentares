name: Update data

on:
  schedule:
    - cron: "0 6 * * *"
  # This is needed so I can manually force a run in GitHub for debugging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "--monorepo python uv"

      - name: Run ingest
        run: mise //ingest:refresh

      - name: Commit refreshed data
        if: ${{ !env.ACT }}
        run: |
          if [[ -z "$(git status --porcelain site/src/data)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data
          git commit -m "chore(data): refresh from parlamento.pt [skip ci]"
          git push
