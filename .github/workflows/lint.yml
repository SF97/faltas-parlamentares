name: Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/src/data/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: ${{ !env.ACT }}
          # Tasks activate their tools; avoid shadowing act's Node with an inactive shim.
          add_shims_to_path: false

      - name: Lint
        env:
          # Task-specific actionlint and ShellCheck installs can use GitHub releases.
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise //:lint
