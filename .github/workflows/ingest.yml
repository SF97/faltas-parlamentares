name: Validate ingest

on:
  # Do not use pull_request.paths: when a workflow is skipped by a path filter,
  # its required check stays pending and blocks unrelated PRs from merging.
  # Start on every PR and detect changes below so unrelated PRs report success
  # without running ingestion, while relevant changes must pass the full refresh.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Ingest sem cache
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detetar alterações no ingest
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              ingest/ package.json pnpm-workspace.yaml mise.toml \
              .github/workflows/ingest.yml .github/workflows/update.yml \
              > "$RUNNER_TEMP/ingest-changes.txt"
            if [[ -s "$RUNNER_TEMP/ingest-changes.txt" ]]; then
              echo "refresh=true" >> "$GITHUB_OUTPUT"
            else
              echo "refresh=false" >> "$GITHUB_OUTPUT"
              echo "Sem alterações no ingest ou na configuração de CI."
            fi
          fi

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: steps.changes.outputs.refresh == 'true'
        with:
          cache: ${{ !env.ACT }}
          install_args: "python pnpm"

      - name: Atualizar dados sem cache HTTP
        if: steps.changes.outputs.refresh == 'true'
        run: mise //ingest:refresh
